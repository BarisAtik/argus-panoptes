# Copy to .github/workflows/search-ci.yml at the repo root to activate it.
# It lives here because this folder's agents only write inside search/.
name: search
on:
  push:
    paths: ["search/**"]
  pull_request:
    paths: ["search/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: search/beacon
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
        env:
          discovery.type: single-node
          xpack.security.enabled: "true"
          xpack.security.http.ssl.enabled: "false"
          xpack.security.transport.ssl.enabled: "false"
          ELASTIC_PASSWORD: ci-only-not-a-secret
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS -u elastic:ci-only-not-a-secret http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 10s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -m "not integration"
      - name: Integration tests against real Elasticsearch
        run: pytest -m integration
        env:
          BEACON_IT: "1"
          ES_URL: http://localhost:9200
          ELASTIC_PASSWORD: ci-only-not-a-secret
