[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beacon-search"
version = "0.1.0"
description = "Private, evaluated hybrid search and RAG over Dutch documents, on single-node Elasticsearch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "elasticsearch>=9,<10",
  "httpx>=0.27",
  "lxml>=5",
  "mcp>=2,<3",
  "numpy>=1.26",
  "snowballstemmer>=2.2",
]

[project.optional-dependencies]
# The default embedder. Pulls in torch: 2+ GB on disk, but it runs on a laptop CPU.
embed = ["sentence-transformers>=3"]
# Light alternative: Dutch word vectors, no torch.
# Also run: python -m spacy download nl_core_news_md
spacy = ["spacy>=3.8"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyyaml>=6", "ruff>=0.6"]

[project.scripts]
beacon = "beacon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a running search engine (set BEACON_IT=1)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
