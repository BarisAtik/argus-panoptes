[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nightwatch-detect"
version = "0.1.0"
description = "Measure whether Sigma detection rules actually fire on an Elasticsearch-style log index."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "mcp>=2,<3",
  "numpy>=1.26",
  "pysigma>=1.5,<2",
  "pysigma-backend-elasticsearch>=2.1,<3",
  "pysigma-backend-sqlite>=2,<3",
  "pysigma-pipeline-sysmon>=2,<3",
  "pysigma-pipeline-windows>=2,<3",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
nightwatch = "nightwatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nightwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a running search engine (set NIGHTWATCH_IT=1)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
