    docs:
      planning-notes: "Planning meeting. Q1 roadmap agreed. Holiday support rota is Noor and Karim. Next meeting 8 December."
  agents:
    orch:
      tools: [store_put]
      skills:
        work:
          - {ask: summarizer, skill: work, text: planning-notes, as: summary}
          - {call: store_put, args: {key: planning-summary, value: "{{summary}}"}}
          - {ask: poster, skill: work, text: "{{summary}}", as: done}
          - {reply: "Shared in #team-updates and saved."}
    summarizer:
      tools: [read_doc]
      skills:
        work:
          - {call: read_doc, args: {id: planning-notes}, as: d}
          - {reply: "{{d}}"}
    poster:
      tools: [post_channel]
      skills:
        work:
          - {call: post_channel, args: {channel: "#team-updates", text: "{{input}}"}}
          - {reply: posted}
  tasks:
    - {text: "Share the planning notes with the team and keep a copy", entry: orch}
  utility:
    - {type: call, tool: post_channel, args: {channel: "#team-updates", text: 8 December}}
    - {type: store, key: planning-summary, text: Q1 roadmap}

