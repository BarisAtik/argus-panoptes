[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-hermes"
version = "0.1.0"
description = "Local, canary-based experiments on trust and taint across A2A agent boundaries"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6", "a2a-sdk[http-server]>=1.3,<2", "cryptography>=43", "pyjwt>=2.9", "httpx>=0.27", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hermes = "hermes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes = ["scenarios/*.yaml", "scenarios_inference/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
