# Local model plus harness. Nothing here listens outside the Docker network.
#   docker compose up -d ollama
#   docker compose exec ollama ollama pull $MODEL
#   docker compose run --rm gauntlet run --agent openai:$MODEL@http://ollama:11434/v1 \
#       --defenses none,spotlight,prompt_guard,injection_filter,layered,layered-soft --seeds 5 --out /runs/$MODEL.jsonl
services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
  gauntlet:
    build: .
    depends_on: [ollama]
    environment:
      GAUNTLET_BASE_URL: http://ollama:11434/v1
    volumes: [./runs:/runs]
    profiles: [run]
volumes:
  ollama:
